      - heading "STANDARD QUESTIONS FROM NEW PERSONNEL" [level=2] [ref=e318]
      - generic [ref=e319]:
        - generic [ref=e320]:
          - heading "Is this official?" [level=3] [ref=e321]
          - paragraph [ref=e322]: No. Deepwell is an unofficial, fan-made reader for the SCP Wiki. It isn’t affiliated with or endorsed by the wiki or its staff.
        - generic [ref=e323]:
          - heading "Am I actually a Level 2 agent?" [level=3] [ref=e324]
          - paragraph [ref=e325]: "Only in spirit. The SCP Foundation is collaborative fiction written by the SCP Wiki community. You don’t need to know any of it to start: open any article and read."
        - generic [ref=e326]:
          - heading "Is it really free?" [level=3] [ref=e327]
          - paragraph [ref=e328]: "Yes. Reading is free forever: every article, no paywall. A one-time $2.99 unlock adds optional extras (more themes, unlimited offline, sync). You never have to pay to read."
        - generic [ref=e329]:
          - heading "Are you selling the SCP stories?" [level=3] [ref=e330]
          - paragraph [ref=e331]: No, and we never will. The content is free and community-owned under CC BY-SA 3.0. Deepwell only charges for software features, such as themes, offline and sync, which sit outside the content.
        - generic [ref=e332]:
          - heading "Do the authors get credit?" [level=3] [ref=e333]
          - paragraph [ref=e334]: Always. Every article shows its author(s), a link to the original on the wiki, and the CC BY-SA 3.0 license. Authors can contact us to change or remove how their work appears.
        - generic [ref=e335]:
          - heading "What devices does it work on?" [level=3] [ref=e336]
          - paragraph [ref=e337]: Deepwell is a web app you can install on iPhone, Android, and desktop — no app store required. It works offline once installed.
        - generic [ref=e338]:
          - heading "Does it track me?" [level=3] [ref=e339]
          - paragraph [ref=e340]: No ads, no trackers, no account required to read. Your reading stays on your device.
        - generic [ref=e341]:
          - heading "Can I read offline?" [level=3] [ref=e342]
          - paragraph [ref=e343]: "Yes. Save articles and read them with no connection: on a plane, underground, anywhere."
