      - 'figure "Distraction-free reading: the interface hidden, only the text" [ref=e222]':
        - paragraph [ref=e224]: At ten past one the lamp on the desk was the only light left. Past it the aisles went on, patient and unlit, and the clerk understood that the count would not be finished tonight, or by anyone.
