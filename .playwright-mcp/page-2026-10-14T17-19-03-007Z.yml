        - paragraph [ref=e208]: MODULE 03 · PERSONNEL WELFARE
        - heading "Workplace safety begins with a comfortable chair." [level=2] [ref=e209]
        - paragraph [ref=e210]: "The files are unsettling by design. The reading shouldn’t be. Deepwell is procedural on the surface and warm underneath: three themes tuned for long shifts, a page with no distractions, and nothing between you and the story. The dread stays in the archive. You get the armchair."
        - list [ref=e211]:
          - listitem [ref=e212]:
            - strong [ref=e213]: Three themes.
            - text: Microfilm by day, Black Lodge by night, Cold Case when you want aged folder-stock sepia.
          - listitem [ref=e214]:
            - strong [ref=e215]: Distraction-free.
            - text: No ads, no clutter, no chrome — the interface disappears while you read.
          - listitem [ref=e216]:
            - strong [ref=e217]: Just the story.
            - text: Beautifully set, quietly yours.
        - generic [ref=e218]:
