  - region [ref=e120]:
    - generic [ref=e122]:
      - paragraph [ref=e123]: INCIDENT REPORT · READING CONDITIONS
      - heading "The wiki was built to edit. Deepwell is built to read." [level=2] [ref=e124]
      - paragraph [ref=e125]: "The SCP Wiki is one of the internet’s greatest collaborative works: thousands of writers, nearly twenty thousand files, decades of dread. Unfortunately at times its reading conditions are, per standing assessment, poor. Cramped columns, tiny text, no dark mode worth the name, no offline access, and it forgets you the moment you close the tab. Personnel have been studying hazardous material in bad light. Deepwell fixes the reading and leaves the archive exactly where it belongs: free, open, and credited to the people who wrote it."
      - generic [ref=e126]:
        - paragraph [ref=e127]: Plain-language summary
        - paragraph [ref=e128]: The wiki is great to read but can be hard on the eyes. Deepwell seeks to provide a more comfortable experience. It could never replace the wiki.
  - region [ref=e129]:
    - generic [ref=e130]:
      - generic [ref=e131]:
        - paragraph [ref=e132]: MODULE 01 · STUDY PROCEDURE
        - heading "Read the files comfortably." [level=2] [ref=e133]
        - paragraph [ref=e134]: Field staff are encouraged to explore the archive in their free time. To better facilitate this use case, Deepwell sets every article in Literata at a comfortable size and measure, the way a book is typeset rather than a wiki page. It is faithful to the source and easier on the eyes, built for the long, late night read that orientation inevitably becomes.
        - list [ref=e135]:
          - listitem [ref=e136]:
            - strong [ref=e137]: Set for reading.
            - text: Literata, generous line-height, a proper reading column — not a wall of wiki text.
          - listitem [ref=e138]:
            - strong [ref=e139]: Faithful to the file.
            - text: Footnotes, collapsibles, tables, and anomaly-classification bars all render cleanly and correctly.
          - listitem [ref=e140]:
            - strong [ref=e141]: Made legible.
            - text: Adjustable size and spacing, plus OpenDyslexic and Atkinson Hyperlegible for readers who need them.
        - generic [ref=e142]:
          - paragraph [ref=e143]: Plain-language summary
          - paragraph [ref=e144]: Beautiful, faithful typography, with accessibility fonts.
